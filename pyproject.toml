[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "proteo-runtime"
dynamic = ["version"]
description = "Provider-neutral runtime contracts and deterministic testing tools."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Proteo Runtime contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4,<5",
  "openai-codex>=0.147,<0.148",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
langgraph = [
  "langgraph>=1.2,<2",
]
langsmith = [
  "langsmith>=0.12,<0.13",
]
otel = [
  "opentelemetry-api>=1.44,<2",
]
all = [
  "langgraph>=1.2,<2",
  "langsmith>=0.12,<0.13",
  "opentelemetry-api>=1.44,<2",
]
dev = [
  "build>=1.2",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "opentelemetry-sdk>=1.44,<2",
  "ruff>=0.9",
  "mypy>=1.13",
  "pre-commit>=4",
  "import-linter>=2.1",
]

[project.scripts]
proteo-runtime = "proteo_runtime.cli.main:main"

[tool.hatch.version]
path = "src/proteo_runtime/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/proteo_runtime"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.git",
  "/.github",
  "/.ci-langgraph-venv",
  "/.ci-sdist-venv",
  "/.ci-wheel-venv",
  "/.idea",
  "/.import_linter_cache",
  "/.mypy_cache",
  "/.pre-commit-cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/.uv-cache",
  "/build",
  "/dist",
  "/htmlcov",
  "/.coverage",
  "**/__pycache__",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: tests requiring an external provider or service"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "ASYNC", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "D202", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["proteo_runtime"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["proteo_runtime"]

[tool.coverage.report]
fail_under = 90
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.importlinter]
root_package = "proteo_runtime"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core does not import providers or external frameworks"
type = "forbidden"
source_modules = ["proteo_runtime.core"]
forbidden_modules = [
  "proteo_runtime.providers",
  "proteo_runtime.integrations",
  "openai_codex",
  "langgraph",
  "langsmith",
  "opentelemetry",
]
